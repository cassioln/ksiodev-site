          - region "Onboard gaming guide" [ref=e245]:
            - article [ref=e246]:
              - heading "Your gaming lounge" [level=3] [ref=e247]
              - paragraph [ref=e248]: "Crystal Lounge is the planned venue for KOB gaming sessions. The room still depends on final ship confirmation. Tables operate on an open, rotating basis: please make room for other players once your game concludes."
              - paragraph [ref=e249]: Extensive hours are planned throughout the day and evening. There is no promise of 24h non-stop operation. Respect Sunday's inventory return cutoff time.
            - article [ref=e250]:
              - heading "Welcome kit & schedule" [level=3] [ref=e251]
              - paragraph [ref=e252]: The kit includes a lanyard/badge for cabin keys, wristband, commemorative collectible coin, and a sturdy board game tote bag from Fácil Shopping. Pickup is estimated for 16:00/16:30 on day one.
              - paragraph [ref=e253]: The entrance board in the gaming hall will display the daily timetable. Check official channels for any schedule updates.
            - article [ref=e254]:
              - heading "Board Game Guru App" [level=3] [ref=e255]
              - paragraph [ref=e256]:
                - text: Download
                - link "Board Game Guru" [ref=e257] [cursor=pointer]:
                  - /url: https://boardgameguru.app/
                - text: (available on iOS and Android) and open the Kriativos On Board event page. Tap ‘I’m going’ to be eligible for raffles.
              - paragraph [ref=e258]: If unable to use the app, contact Encounter staff to request manual registration. Use the app to browse the game catalog, filter titles, and bookmark favorites.
            - article [ref=e259]:
              - heading "Monitors & Finding tables" [level=3] [ref=e260]
              - paragraph [ref=e261]: Encounter monitors will help you select games and teach rules. Solo travelers and newcomers can easily connect with friendly groups.
              - paragraph [ref=e262]: You are welcome to bring personal board games and prototypes, within luggage limits. When taking library games outside the lounge, register your name and cabin with the monitor desk.
            - article [ref=e263]:
              - heading "Tournaments & Closing party" [level=3] [ref=e264]
              - paragraph [ref=e265]: Check the daily notice board for confirmed tournaments and raffle schedules. Bring your 80s retro outfit for Sunday night's farewell celebration!
